<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Striped E for small sizes: drawn pixel by pixel, one hero-gradient band per row. logo-e.svg has the cut-line version. -->
  <rect width="16" height="16" rx="3" fill="#050506" shape-rendering="geometricPrecision"/>
  <rect x="3" y="2" width="10" height="1" fill="#ffd9b8"/>
  <rect x="3" y="3" width="10" height="1" fill="#ffc49e"/>
  <rect x="3" y="4" width="10" height="1" fill="#ffb084"/>
  <rect x="3" y="5" width="3" height="1" fill="#ff9b6a"/>
  <rect x="3" y="6" width="3" height="1" fill="#ff8750"/>
  <rect x="3" y="7" width="8" height="1" fill="#ff7235"/>
  <rect x="3" y="8" width="8" height="1" fill="#ed673e"/>
  <rect x="3" y="9" width="8" height="1" fill="#d0635e"/>
  <rect x="3" y="10" width="3" height="1" fill="#b35e7f"/>
  <rect x="3" y="11" width="3" height="1" fill="#955a9f"/>
  <rect x="3" y="12" width="10" height="1" fill="#7855bf"/>
  <rect x="3" y="13" width="10" height="1" fill="#5a51df"/>
  <rect x="3" y="14" width="10" height="1" fill="#3d4cff"/>
</svg>
